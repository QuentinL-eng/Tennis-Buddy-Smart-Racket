; Tennis Buddy racket firmware: Seeed XIAO ESP32C3 + MPU6050 + H3LIS331DL
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
; Sync conflict copies contain duplicate setup()/loop() definitions.
; Legacy OTA source uses the old protocol (0006 is now tap detection).
; main.cpp does not use OTA; keep that source out of the current firmware.
build_src_filter = +<*> -<*.sync-conflict-*> -<ota.cpp>
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; NimBLE buffers (default 12): the 1 kHz IMU stream needs several in flight, with some left over for
    ; the stack's replies (subscribing, firmware updates). See BLE_BUFFER_RESERVE in src/main.cpp.
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=32

; I2C wiring check: pio run -e i2cscan -t upload
[env:i2cscan]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../tools/i2cscan/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; INMP441 wiring check: pio run -e micprobe -t upload
[env:micprobe]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../tools/micprobe/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Tap capture probe (6.67 kHz IMU windows around mic triggers): pio run -e tapprobe -t upload
[env:tapprobe]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../tools/tapprobe/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; INMP441 pin finder (tries every SCK/WS/SD combination): pio run -e micscan -t upload
; Minimal on-chip tap engine test: pio run -e taptest -t upload
[env:taptest]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../tools/taptest/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; INMP441 pin finder (tries every SCK/WS/SD combination): pio run -e micscan -t upload
[env:micscan]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../tools/micscan/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
