# Tennis Buddy Xcode project. Regenerate after adding files:  cd apple && xcodegen
name: TennisBuddy
options:
  bundleIdPrefix: com.quentinlynch
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"

settings:
  base:
    DEVELOPMENT_TEAM: 3KJ46YFZM9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_PREVIEWS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.5
  RacketKit:
    path: RacketKit

targets:
  TennisBuddy-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes:
          - "**/*.sync-conflict-*"
          # Legacy tap UI is not wired to the current AppModel.
          - Views/ScoreView.swift
          - Views/TapCalibrationView.swift
      - path: iOS
    dependencies:
      - package: RacketKit
      - package: Supabase
      - target: TennisBuddyWatch
    settings:
      base:
        PRODUCT_NAME: Tennis Buddee
        PRODUCT_BUNDLE_IDENTIFIER: com.quentinlynch.tennisbuddy
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Tennis Buddee
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tennisbuddee]
            CFBundleURLName: com.quentinlynch.tennisbuddy.auth
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [bluetooth-central, audio, remote-notification]
        NSBluetoothAlwaysUsageDescription: Tennis Buddy connects to your racket's sensor over Bluetooth.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: iOS/TennisBuddy.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.quentinlynch.tennisbuddy]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development

  TennisBuddy-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes:
          - "**/*.sync-conflict-*"
          # Legacy tap UI is not wired to the current AppModel.
          - Views/ScoreView.swift
          - Views/TapCalibrationView.swift
    dependencies:
      - package: RacketKit
      - package: Supabase
    settings:
      base:
        PRODUCT_NAME: Tennis Buddee
        PRODUCT_BUNDLE_IDENTIFIER: com.quentinlynch.tennisbuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Tennis Buddee
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tennisbuddee]
            CFBundleURLName: com.quentinlynch.tennisbuddy.auth
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Tennis Buddy connects to your racket's sensor over Bluetooth.
    entitlements:
      path: macOS/TennisBuddy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.quentinlynch.tennisbuddy]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development

  TennisBuddyWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    dependencies:
      - package: RacketKit
    settings:
      base:
        PRODUCT_NAME: Tennis Buddee
        PRODUCT_BUNDLE_IDENTIFIER: com.quentinlynch.tennisbuddy.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Tennis Buddee
        WKApplication: true
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: com.quentinlynch.tennisbuddy
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Tennis Buddy reads your heart rate and calories during a tennis session.
        NSHealthUpdateUsageDescription: Tennis Buddy saves your tennis sessions as workouts in Apple Health.
    entitlements:
      path: Watch/TennisBuddyWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

  CoachTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared/Coach
      - path: Shared/Social/AppleSignInChallenge.swift
      - path: Shared/Social/SocialModels.swift
      - path: Shared/Model/Records.swift
      - path: Shared/Model/InsightsModel.swift
      - path: Shared/Model/AppModel.swift
    dependencies:
      - package: RacketKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TennisBuddy-macOS:
    build:
      targets:
        TennisBuddy-macOS: all
        CoachTests: [test]
    test:
      targets: [CoachTests]
