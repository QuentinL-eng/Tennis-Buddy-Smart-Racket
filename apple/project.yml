# Tennis Buddy Xcode project. Regenerate after adding files:  cd apple && xcodegen
name: TennisBuddy
options:
  bundleIdPrefix: com.kellamadams
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"

settings:
  base:
    DEVELOPMENT_TEAM: B8QLYC5T9U
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

packages:
  RacketKit:
    path: RacketKit

targets:
  TennisBuddy-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - package: RacketKit
      - target: TennisBuddyWatch
    settings:
      base:
        PRODUCT_NAME: Tennis Buddy
        PRODUCT_BUNDLE_IDENTIFIER: com.kellamadams.tennisbuddy
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Tennis Buddy
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Tennis Buddy connects to your racket's sensor over Bluetooth.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  TennisBuddy-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
    dependencies:
      - package: RacketKit
    settings:
      base:
        PRODUCT_NAME: Tennis Buddy
        PRODUCT_BUNDLE_IDENTIFIER: com.kellamadams.tennisbuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Tennis Buddy
        LSApplicationCategoryType: public.app-category.sports
        NSBluetoothAlwaysUsageDescription: Tennis Buddy connects to your racket's sensor over Bluetooth.
    entitlements:
      path: macOS/TennisBuddy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true

  TennisBuddyWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    dependencies:
      - package: RacketKit
    settings:
      base:
        PRODUCT_NAME: Tennis Buddy
        PRODUCT_BUNDLE_IDENTIFIER: com.kellamadams.tennisbuddy.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Tennis Buddy
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.kellamadams.tennisbuddy
