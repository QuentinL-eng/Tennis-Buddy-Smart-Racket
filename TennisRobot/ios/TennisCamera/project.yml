name: TennisCamera
options:
  bundleIdPrefix: com.tennisrobot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    # This app exists to measure millisecond timing. Release is the
    # configuration that runs and that the scheme tests, so testability is on
    # there; Debug stays unoptimised for stepping through the detector.
    Release:
      ENABLE_TESTABILITY: YES
targets:
  TennisCamera:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tennisrobot.camera
        PRODUCT_NAME: TennisCamera
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SUPPORTS_MACCATALYST: NO
  TennisCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TennisCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tennisrobot.camera.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TennisCamera:
    build:
      targets:
        TennisCamera: all
        TennisCameraTests: [test]
    run:
      config: Release
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - TennisCameraTests
