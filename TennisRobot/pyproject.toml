[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisrobot"
version = "0.1.0"
description = "Camera-to-arm tennis ball interception framework (Arduino UNO Q + Epson C8)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8"]
dev = ["pytest>=7"]

[project.scripts]
tennisrobot = "tennisrobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
