<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tennis Buddee on Glasses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hud.css">
</head>
<body>
  <div class="world"></div>
  <div class="lens"></div>

  <div class="display">
    <div class="time">12:48</div>
    <div class="vitals">
      <span class="bpm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.3 0 5.6 3.1 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>
        128 bpm
      </span>
      <span class="kcal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21.5c-3.9 0-6.5-2.7-6.5-6.2 0-3.6 2.6-5.6 3.8-8.8.4 1.9 1.4 3 2.4 3.6.2-3 1.6-5.6 3.8-7.6.1 3.4 3 6.4 3 11.2 0 4.3-2.6 7.8-6.5 7.8z"/><path d="M12 21.5c-1.7 0-2.8-1.3-2.8-2.9 0-1.8 1.4-2.7 2-4.3.9 1 2.1 1.9 2.1 4 0 1.8-.7 3.2-1.3 3.2z"/></svg>
        142 kcal
      </span>
    </div>
    <div class="shots">48 shots · 67% sweet spot</div>

    <div class="score">
      <div class="names">
        <div class="row">
          <div class="who"><span class="ballslot"><svg viewBox="0 0 24 24" fill="none" stroke="#c8f03c" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M5.2 5.4c3 2.6 3 10.6 0 13.2M18.8 5.4c-3 2.6-3 10.6 0 13.2"/></svg></span>YOU</div>
          <div class="g">6</div><div class="s">3</div>
        </div>
        <div class="row">
          <div class="who"><span class="ballslot"></span>OPPONENT</div>
          <div class="g">4</div><div class="s">2</div>
        </div>
      </div>
      <div class="pts"><div>40</div><div>15</div></div>
    </div>

    <div class="pill">Pinch and hold to end session</div>
  </div>
</body>
</html>
